AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SignalBench service: ECS Fargate (arm64) behind an internet-facing ALB that
  terminates TLS for signalbench.sholaayeni.xyz. HTTP redirects to HTTPS.
  GitHub Actions registers new task definitions and updates the service; this
  stack only sets the initial image.

Parameters:
  ImageUri:
    Type: String
    Description: Full image URI with tag for the first deploy, e.g. <acct>.dkr.ecr.eu-north-1.amazonaws.com/signalbench/web:<sha>
  CommitSha:
    Type: String
    Default: bootstrap
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 4

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: signalbench
      ClusterSettings:
        - { Name: containerInsights, Value: disabled }
      Tags:
        - { Key: Project, Value: signalbench }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /signalbench/prod/web
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SignalBench-TaskExecution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - { Key: Project, Value: signalbench }

  # The app calls no AWS APIs, so the task role has no permissions.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SignalBench-Task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Tags:
        - { Key: Project, Value: signalbench }

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: signalbench-web
      Cpu: "256"
      Memory: "512"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: false
          PortMappings:
            - { ContainerPort: 3000, Protocol: tcp }
          Environment:
            - { Name: COMMIT_SHA, Value: !Ref CommitSha }
          HealthCheck:
            Command: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 20
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SignalBench ALB - public HTTP and HTTPS
      VpcId: !ImportValue SignalBench-VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0" }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0" }
      Tags:
        - { Key: Name, Value: signalbench-alb }
        - { Key: Project, Value: signalbench }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SignalBench tasks - only the ALB may connect
      VpcId: !ImportValue SignalBench-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - { Key: Name, Value: signalbench-task }
        - { Key: Project, Value: signalbench }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: signalbench
      Type: application
      Scheme: internet-facing
      Subnets: !Split [",", !ImportValue SignalBench-PublicSubnets]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: idle_timeout.timeout_seconds, Value: "30" }
      Tags:
        - { Key: Project, Value: signalbench }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: signalbench-web
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      VpcId: !ImportValue SignalBench-VpcId
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "15" }
      Tags:
        - { Key: Project, Value: signalbench }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !ImportValue SignalBench-CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: signalbench-web
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 30
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Split [",", !ImportValue SignalBench-PublicSubnets]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - { Key: Project, Value: signalbench }
        - { Key: Env, Value: prod }

Outputs:
  LoadBalancerDnsName:
    Description: Point the signalbench CNAME in Namecheap here
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name

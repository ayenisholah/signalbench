name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call: # Deploy runs the verify job first; it builds its own arm64 image.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SB_HISTORY_DAYS: "60"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Fetch market data and run backtests
        run: npm run fetch && npm run backtest
      - run: npm run build

  image:
    name: Container build
    # In a called workflow github.workflow is the caller's name, so this skips the image build there.
    if: ${{ github.workflow == 'CI' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: signalbench/web:ci
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            SB_HISTORY_DAYS=60
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: Smoke test the image
        run: |
          docker run -d --name sb -p 3000:3000 signalbench/web:ci
          up=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != 1 ]; then docker logs sb; exit 1; fi
          echo
          # Pages and the metadata routes (sitemap, robots, manifest, share image) must all render in the container.
          for path in / /methodology /robots.txt /sitemap.xml /manifest.webmanifest /opengraph-image; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path $code"
            if [ "$code" != 200 ]; then docker logs sb; exit 1; fi
          done
          curl -fsSI http://127.0.0.1:3000/ | grep -qi '^content-security-policy:' || { echo "missing CSP header"; exit 1; }

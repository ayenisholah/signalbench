name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Deploys run one at a time and are never cancelled half-way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, push and roll out
    needs: verify
    # Skipped until scripts/aws/create-deployer-key.sh has configured the repo (see docs/DEPLOYMENT.md).
    if: ${{ vars.ECS_SERVICE != '' }}
    runs-on: ubuntu-24.04-arm # native arm64 build for the Graviton Fargate task
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      TASK_FAMILY: signalbench-web
      CONTAINER_NAME: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Access keys for a least-privilege IAM user: the org SCP forbids GitHub OIDC.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Tags are immutable in ECR, and the nightly refresh rebuilds the same commit, so the run id goes in the tag.
      - id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            DATA_BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=deploy-arm64
          cache-to: type=gha,mode=max,scope=deploy-arm64

      - name: Read the live task definition
        run: aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}
          # Fargate sets HOSTNAME to the task's hostname, and Next's standalone server binds to $HOSTNAME,
          # which would hide it from the in-container health check on 127.0.0.1. Bind to all interfaces.
          environment-variables: |
            COMMIT_SHA=${{ github.sha }}
            HOSTNAME=0.0.0.0

      # The service's deployment circuit breaker rolls back automatically if new tasks fail health checks.
      - uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          desired-count: 1 # the service stack starts at 0 tasks until the first real image exists
          wait-for-service-stability: true
          wait-for-minutes: 15

      - name: Smoke test the public URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 20); do
            body=$(curl -fsS "$APP_URL/api/health" || true)
            echo "$body"
            if echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""; then exit 0; fi
            sleep 6
          done
          echo "::error::$APP_URL/api/health did not report commit $GITHUB_SHA"
          exit 1
